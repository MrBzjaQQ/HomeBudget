<div class="space-y-3">

      </span>
      <span class="text-gray-300">›</span>

    <a routerLink="/goals" class="nav-row">
      <span class="nav-ico">🎯</span>
      <span class="flex-1">
        <span class="block text-sm font-medium text-gray-900">Финансовые цели</span>
        <span class="block text-xs text-gray-400">цели и план откладывать в месяц</span>
      </span>
      <span class="text-gray-300">›</span>
    </a>
    <a routerLink="/categories" class="nav-row">

      <span class="flex-1">

      </span>
